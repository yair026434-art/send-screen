<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="עסקים">
<title>עסקים לפנייה</title>
<style>
[hidden]{display:none!important}
:root{--bg:#eff3f1;--card:#fff;--ink:#14201b;--soft:#586660;--line:#d9e1dd;--green:#0f7f43;--green-ink:#fff;--tint:#dff3e7;--red:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1513;--card:#1a2320;--ink:#eef3f0;--soft:#a2afa9;--line:#2c3733;--green:#27b56a;--green-ink:#06130c;--tint:#17352a;--red:#f2877f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1513;--card:#1a2320;--ink:#eef3f0;--soft:#a2afa9;--line:#2c3733;--green:#27b56a;--green-ink:#06130c;--tint:#17352a;--red:#f2877f;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:inherit}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--green);outline-offset:2px}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#setup{max-width:520px;margin:auto;padding-block:calc(env(safe-area-inset-top,0px) + 44px) 28px;display:flex;flex-direction:column;gap:14px}
#setup h1{margin:0;font-size:29px;line-height:1.15}
#setup p{margin:0;color:var(--soft);font-size:17px;line-height:1.45}
.pick{display:flex;align-items:center;justify-content:center;min-height:62px;border-radius:13px;background:var(--green);color:var(--green-ink);font-size:19px;font-weight:700;cursor:pointer;padding:8px 14px}
.pick input,.foot input{position:absolute;opacity:0;width:1px;height:1px}
#setupError{color:var(--red);font-weight:600}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:9px;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
header h1{margin:0;font-size:21px}
#progress{color:var(--soft);font-size:14px;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:var(--line);margin:7px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#q,#cat{display:block;width:100%;min-width:0;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 10px;font-size:16px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:2px;margin-top:7px;background:var(--line);border-radius:9px}
.seg button{height:34px;border:0;border-radius:7px;background:transparent;font-size:14px}
.seg button[aria-pressed=true]{background:var(--card);font-weight:700}
main{max-width:560px;margin:auto;padding-block:10px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:9px;content-visibility:auto;contain-intrinsic-size:auto 190px}
.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.head>div{min-width:0}
.name{font-size:18px;font-weight:700;overflow-wrap:anywhere}
.kind{color:var(--soft);font-size:14px;margin-top:1px}
.city{flex:none;max-width:40%;color:var(--soft);font-size:13px;background:var(--bg);border-radius:6px;padding:2px 7px}
.note{color:var(--soft);font-size:14px;margin-top:5px;overflow-wrap:anywhere}
.open{display:flex;align-items:center;justify-content:center;min-height:52px;margin-top:10px;border-radius:11px;background:var(--green);color:var(--green-ink);font-size:18px;font-weight:700;text-decoration:none;touch-action:manipulation}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.tel{direction:ltr;color:var(--soft);font-size:14px;font-variant-numeric:tabular-nums}
.state{height:38px;max-width:62%;border:1px solid var(--line);border-radius:9px;background:var(--card);padding:0 8px;font-size:16px}
.card.done .open{background:var(--tint);color:var(--ink)}
.card.stop .open{display:none}
.card.stop .state{color:var(--red);border-color:var(--red)}
#empty{text-align:center;color:var(--soft);padding:44px 12px;font-size:17px}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:16px;color:var(--soft);font-size:13px}
.foot label{text-decoration:underline;cursor:pointer}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;right:16px;z-index:20;background:var(--red);color:#fff;border-radius:10px;padding:10px 12px;text-align:center}
</style>
</head>
<body>
<section id="setup" class="gutter" hidden>
  <h1>טעינת רשימת העסקים</h1>
  <p>בוחרים פעם אחת את הקובץ <b>עסקים-לטלפון</b> מאפליקציית קבצים. הרשימה נשמרת רק בטלפון הזה.</p>
  <label class="pick">בחירת הקובץ<input id="file" type="file" accept=".json,application/json,text/plain"></label>
  <div id="setupError" role="alert" hidden></div>
</section>
<div id="work" hidden>
  <header class="gutter">
    <div class="top"><h1>עסקים לפנייה</h1><span id="progress"></span></div>
    <div class="bar"><i id="fill"></i></div>
    <div class="filters">
      <input id="q" type="search" placeholder="חיפוש" autocomplete="off" aria-label="חיפוש לפי שם, תחום או עיר">
      <select id="cat" aria-label="תחום"></select>
    </div>
    <div class="seg" id="views">
      <button data-v="todo" aria-pressed="true">לא פניתי</button>
      <button data-v="done" aria-pressed="false">פניתי</button>
      <button data-v="all" aria-pressed="false">הכול</button>
    </div>
  </header>
  <main class="gutter">
    <div id="list"></div>
    <div id="empty" hidden></div>
    <div class="foot"><span>ההתקדמות נשמרת בטלפון הזה</span><label>החלפת קובץ<input id="file2" type="file" accept=".json,application/json,text/plain"></label></div>
  </main>
</div>
<div id="toast" role="alert" hidden></div>
<script>
const NEW = 'לא פניתי', SENT = 'פניתי';
const STATUSES = [NEW, SENT, 'ענה', 'פרסם משרה', 'לא מעוניין', 'ביקש לא לפנות'];
const STOP = new Set(['לא מעוניין', 'ביקש לא לפנות']);
const LS = 'jowise-biz-progress-v1', YOUNG = '__young', ALL = '__all';
const $ = id => document.getElementById(id);
const state = {cat: ALL, view: 'todo', q: ''};
let leads = [], statuses = {};

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { t.hidden = true; }, 3500);
}
function readLocal() {
  try { statuses = JSON.parse(localStorage.getItem(LS) || '{}') || {}; } catch (_) { statuses = {}; }
}
function writeLocal() {
  try { localStorage.setItem(LS, JSON.stringify(statuses)); } catch (_) { toast('ההתקדמות לא נשמרה בטלפון'); }
}
function openStore() {
  return new Promise((ok, no) => {
    const r = indexedDB.open('jowise-biz', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('files');
    r.onsuccess = () => ok(r.result);
    r.onerror = () => no(r.error);
  });
}
async function storeGet(key) {
  const d = await openStore();
  return new Promise((ok, no) => {
    const r = d.transaction('files').objectStore('files').get(key);
    r.onsuccess = () => ok(r.result);
    r.onerror = () => no(r.error);
  });
}
async function storePut(key, value) {
  const d = await openStore();
  return new Promise((ok, no) => {
    const t = d.transaction('files', 'readwrite');
    t.objectStore('files').put(value, key);
    t.oncomplete = () => ok();
    t.onerror = () => no(t.error);
  });
}
function parseLeads(text) {
  const d = JSON.parse(text);
  if (!d || d.kind !== 'jowise-biz' || !Array.isArray(d.leads) || !d.leads.length) throw new Error('kind');
  return d.leads.map(x => {
    if (!/^9725\d{8}$/.test(x.p) || typeof x.n !== 'string' || typeof x.c !== 'string') throw new Error('row');
    return {id: x.p, name: x.n, cat: x.c, city: String(x.y || ''), note: String(x.t || ''), young: !!x.h,
      tel: '0' + x.p.slice(3, 5) + '-' + x.p.slice(5), url: 'https://wa.me/' + x.p + (typeof x.m === 'string' && x.m ? '?text=' + encodeURIComponent(x.m) : ''), status: statuses[x.p] || NEW};
  });
}
function fillCats() {
  const s = $('cat'), count = {};
  leads.forEach(l => { count[l.cat] = (count[l.cat] || 0) + 1; });
  const young = leads.filter(l => l.young).length;
  s.replaceChildren(new Option('כל התחומים (' + leads.length + ')', ALL));
  if (young) s.append(new Option('צעירים רוצים (' + young + ')', YOUNG));
  Object.keys(count).sort((a, b) => a.localeCompare(b, 'he')).forEach(c => s.append(new Option(c + ' (' + count[c] + ')', c)));
  if (![...s.options].some(o => o.value === state.cat)) state.cat = ALL;
  s.value = state.cat;
}
function begin(text) {
  leads = parseLeads(text);
  fillCats();
  $('setup').hidden = true;
  $('work').hidden = false;
  render();
}
async function takeFile(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  try {
    const text = await f.text();
    begin(text);
    try { await storePut('leads', text); }
    catch (_) { toast('הרשימה לא נשמרה, ויהיה צריך לבחור את הקובץ שוב בפתיחה הבאה'); }
  } catch (_) {
    const msg = 'זה לא הקובץ הנכון. צריך לבחור את הקובץ עסקים-לטלפון';
    if ($('work').hidden) { $('setupError').textContent = msg; $('setupError').hidden = false; }
    else toast(msg);
  } finally {
    input.value = '';
  }
}
function matches(l) {
  if (state.cat === YOUNG ? !l.young : state.cat !== ALL && l.cat !== state.cat) return false;
  if (state.view === 'todo' && l.status !== NEW) return false;
  if (state.view === 'done' && l.status === NEW) return false;
  if (!state.q) return true;
  return (l.name + ' ' + l.cat + ' ' + l.city + ' ' + l.note + ' ' + l.tel).toLowerCase().includes(state.q);
}
function paint(c, l) {
  c.classList.toggle('done', l.status !== NEW && !STOP.has(l.status));
  c.classList.toggle('stop', STOP.has(l.status));
  c.querySelector('.state').value = l.status;
  c.querySelector('.open').textContent = l.status === NEW ? 'פתיחת שיחה בוואטסאפ' : 'פתיחת השיחה שוב';
}
function save(l, value, c) {
  l.status = value;
  if (value === NEW) delete statuses[l.id]; else statuses[l.id] = value;
  writeLocal();
  paint(c, l);
  counts();
}
function card(l) {
  const c = el('article', 'card');
  const head = el('div', 'head'), who = el('div');
  who.append(el('div', 'name', l.name), el('div', 'kind', l.cat));
  head.append(who);
  if (l.city) head.append(el('span', 'city', l.city));
  c.append(head);
  if (l.note) c.append(el('div', 'note', l.note));
  const a = el('a', 'open');
  a.href = l.url;
  a.rel = 'noreferrer';
  a.addEventListener('click', () => { if (l.status === NEW) setTimeout(() => save(l, SENT, c), 400); });
  const row = el('div', 'row');
  const s = el('select', 'state');
  s.setAttribute('aria-label', 'סטטוס של ' + l.name);
  STATUSES.forEach(v => s.append(new Option(v, v)));
  s.addEventListener('change', () => save(l, s.value, c));
  row.append(s, el('span', 'tel', l.tel));
  c.append(a, row);
  paint(c, l);
  return c;
}
function counts() {
  const sent = leads.filter(l => l.status !== NEW).length;
  $('progress').textContent = 'פנית ל-' + sent + ' מתוך ' + leads.length;
  $('fill').style.width = (leads.length ? 100 * sent / leads.length : 0) + '%';
}
function render() {
  const shown = leads.filter(matches);
  $('list').replaceChildren(...shown.map(card));
  $('empty').hidden = shown.length > 0;
  $('empty').textContent = state.q ? 'לא נמצאו תוצאות' : state.view === 'todo' ? 'פנית לכל העסקים כאן' : 'אין כאן עדיין פניות';
  counts();
}
$('views').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  state.view = b.dataset.v;
  $('views').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
  scrollTo(0, 0);
});
$('cat').addEventListener('change', e => { state.cat = e.target.value; render(); scrollTo(0, 0); });
$('q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); render(); });
$('file').addEventListener('change', e => takeFile(e.target));
$('file2').addEventListener('change', e => takeFile(e.target));
(async () => {
  readLocal();
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (_) {}
  let saved = null;
  try { saved = await Promise.race([storeGet('leads'), new Promise(ok => setTimeout(() => ok(null), 2500))]); } catch (_) {}
  if (leads.length) return;
  if (saved) { try { begin(saved); } catch (_) { saved = null; } }
  if (!saved) $('setup').hidden = false;
})();
</script>
</body>
</html>
